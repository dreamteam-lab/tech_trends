services:
  collector:
    build:
      context: .
      dockerfile: Dockerfile
    image: tech-trends-collector:dev
    init: true
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATA_DIR: /app/data
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-20}
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
      - ./tests:/app/tests:ro
    entrypoint:
      - python
      - -m
      - tech_trends.cli
    command:
      - --technology
      - python
      - --days
      - "7"
      - --page-size
      - "100"

  github-collector:
    image: tech-trends-collector:dev
    init: true
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-20}
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
    entrypoint:
      - python
      - -m
      - tech_trends.github_cli
    command:
      - --technology
      - python
      - --days
      - "7"
      - --page-size
      - "100"

  pypi-collector:
    image: tech-trends-collector:dev
    init: true
    environment:
      DATA_DIR: /app/data
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-20}
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
    entrypoint:
      - python
      - -m
      - tech_trends.pypi_cli
    command:
      - --package
      - pandas

  pypi-downloads-collector:
    image: tech-trends-collector:dev
    init: true
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /var/secrets/google/adc.json
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
      - type: bind
        source: ${GCP_ADC_PATH}
        target: /var/secrets/google/adc.json
        read_only: true
    entrypoint:
      - python
      - -m
      - tech_trends.pypi_downloads_cli
    command:
      - --package
      - pandas
      - --days
      - "7"

  stack-overflow-collector:
    image: tech-trends-collector:dev
    init: true
    environment:
      DATA_DIR: /app/data
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-20}
      STACK_EXCHANGE_KEY: ${STACK_EXCHANGE_KEY:-}
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
    entrypoint:
      - python
      - -m
      - tech_trends.stack_overflow_cli
    command:
      - --tag
      - python
      - --days
      - "7"
      - --page-size
      - "100"

  npm-collector:
    image: tech-trends-collector:dev
    init: true
    environment:
      DATA_DIR: /app/data
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-20}
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
    entrypoint:
      - python
      - -m
      - tech_trends.npm_cli
    command:
      - --package
      - react

  npm-downloads-collector:
    image: tech-trends-collector:dev
    init: true
    environment:
      DATA_DIR: /app/data
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-20}
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
    entrypoint:
      - python
      - -m
      - tech_trends.npm_downloads_cli
    command:
      - --package
      - react
      - --days
      - "7"

  seaweedfs:
    build:
      context: ./seaweedfs
      dockerfile: Dockerfile
    image: tech-trends-seaweedfs:4.41
    container_name: tech-trends-seaweedfs
    environment:
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
    ports:
      - "8333:8333"   # S3 API — используется контейнерами и для локальной диагностики (aws-cli/mc)
      - "9333:9333"   # Master UI — диагностический интерфейс SeaweedFS (статус кластера, volumes)
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://seaweedfs:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.41
    container_name: tech-trends-seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        weed shell -master=seaweedfs:9333 <<'HDOC' || true
        s3.bucket.create -name tech-trends-bronze
        s3.bucket.create -name tech-trends-silver
        s3.bucket.list
        HDOC
    restart: "no"

  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: tech-trends-spark:4.1.3
    container_name: tech-trends-spark
    hostname: spark-master
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY}
    entrypoint:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "${SPARK_UI_PORT:-8080}:8080"   # Spark Master UI
      - "7077:7077"   # Spark master endpoint (опционально, для внешнего spark-submit)
    volumes:
      - ./spark/jobs:/opt/spark/jobs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  seaweedfs-data:
