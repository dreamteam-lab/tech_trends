name: CI

on:
  pull_request:
    branches:
      - develop
      - master

jobs:
  guard-master-source:
    name: Guard master source branch
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'master'
    steps:
      - name: Ensure PR into master comes only from develop
        run: |
          if [ "${{ github.event.pull_request.head.ref }}" != "develop" ]; then
            echo "::error::Merge в master разрешён только из ветки develop. Текущая source-ветка: ${{ github.event.pull_request.head.ref }}"
            exit 1
          fi

  tests:
    name: Run tests (stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v
