# --- Доступ к SeaweedFS через S3A (bronze/silver слои) ---
spark.hadoop.fs.s3a.endpoint                 http://seaweedfs:8333
spark.hadoop.fs.s3a.path.style.access        true
spark.hadoop.fs.s3a.impl                     org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled   false
spark.hadoop.fs.s3a.fast.upload              true

# Credentials НЕ хранятся здесь и не попадают в образ/Git.
# Hadoop S3A по умолчанию сам подхватывает их из переменных окружения
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY контейнера (см. compose.yaml,
# значения приходят из .env).

# --- Режим выполнения по умолчанию ---
# spark-submit / pyspark внутри контейнера по умолчанию работают в local[*]:
# отдельный spark-worker в MVP не поднимаем. Standalone Master запущен
# отдельно только ради Spark UI (порт 8080) и задела под будущий кластер.
spark.master                                  local[*]
